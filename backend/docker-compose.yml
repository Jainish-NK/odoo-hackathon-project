services:
  postgres:
    image: postgres:16-alpine
    container_name: globetrotter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-globetrotter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globetrotter}
      POSTGRES_DB: ${POSTGRES_DB:-globetrotter}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-globetrotter}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - globetrotter-network

  redis:
    image: redis:7-alpine
    container_name: globetrotter-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - globetrotter-network

  backend:
    build:
      context: .
      target: development
    container_name: globetrotter-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-globetrotter}:${POSTGRES_PASSWORD:-globetrotter}@postgres:5432/${POSTGRES_DB:-globetrotter}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '${PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/app/src
      - ./prisma:/usr/src/app/prisma
    healthcheck:
      # busybox wget ships in the node:alpine base image, so no extra
      # package install is needed just for the healthcheck.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - globetrotter-network

volumes:
  postgres_data:
  redis_data:

networks:
  globetrotter-network:
    driver: bridge
